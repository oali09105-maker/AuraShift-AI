name: Build AuraShift AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup EAS CLI
        run: |
          npm install -g eas-cli

      - name: 📦 Install Project Dependencies
        run: |
          npm install

      - name: 🔨 Build Local Standalone APK
        env:
          EAS_NO_VCS: '1'
        run: |
          eas build --platform android --profile production-apk-local --local --non-interactive --output ./AuraShift-AI.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraShift-AI-Production-APK
          path: ./AuraShift-AI.apk
