name: Build AuraShift AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install Project Dependencies
        run: |
          npm install

      - name: ⚙️ Expo Prebuild
        run: |
          npx expo prebuild --platform android --clean

      - name: 🔨 Build Local Standalone Release APK
        run: |
          KEYSTORE_PASS=$(node -e "console.log(require('./credentials.json').android.keystore.keystorePassword)")
          KEY_ALIAS=$(node -e "console.log(require('./credentials.json').android.keystore.keyAlias)")
          KEY_PASS=$(node -e "console.log(require('./credentials.json').android.keystore.keyPassword)")
          KEYSTORE_PATH=$(node -e "console.log(require('./credentials.json').android.keystore.keystorePath)")

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASS \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASS
          cp app/build/outputs/apk/release/app-release.apk ../AuraShift-AI.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraShift-AI-Production-APK
          path: ./AuraShift-AI.apk
